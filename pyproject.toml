[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-compute"
version = "0.1.0"
description = "Citizen-powered, privacy-first distributed compute toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SovereignCompute Contributors"}
]
keywords = ["distributed-compute", "local-ai", "sustainability", "open-source", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]

[project.scripts]
sovereign-compute = "sovereign_compute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
